name: Build MSI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ime-windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  build-msi:
    name: Build Windows MSI
    runs-on: windows-2022
    outputs:
      release-version: ${{ steps.release-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve Asia/Taipei CalVer
        id: release-version
        shell: pwsh
        run: |
          $date = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(8))
          # This version is only for release tags and latest.json, not WiX.
          $revision = 1000 + [long]"${{ github.run_number }}"
          $version = "$($date.ToString('yyyy.MM.dd')).$revision"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Resolve vcpkg cache identity
        id: vcpkg-cache
        shell: pwsh
        run: |
          $imageVersion = $env:ImageVersion
          if ($imageVersion -notmatch '^[0-9A-Za-z._-]+$') {
            throw "GitHub runner did not provide a valid ImageVersion: $imageVersion"
          }

          $vcpkgRevision = (& git -C vcpkg rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $vcpkgRevision -notmatch '^[0-9a-f]{40}$') {
            throw "Could not resolve the vcpkg submodule revision: $vcpkgRevision"
          }

          "image=$imageVersion" >> $env:GITHUB_OUTPUT
          "revision=$vcpkgRevision" >> $env:GITHUB_OUTPUT

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-cache
            vcpkg/downloads
          # A new runner image gets a new save key; exact cache hits are immutable.
          # vcpkg's ABI hash decides which packages from older images can be reused.
          key: v3-${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ steps.vcpkg-cache.outputs.revision }}-x64-windows-cpu-dispatch-${{ hashFiles('cmake/triplets/*.cmake', 'vcpkg.json', 'vcpkg-configuration.json') }}-image-${{ steps.vcpkg-cache.outputs.image }}
          restore-keys: |
            v3-${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ steps.vcpkg-cache.outputs.revision }}-x64-windows-cpu-dispatch-${{ hashFiles('cmake/triplets/*.cmake', 'vcpkg.json', 'vcpkg-configuration.json') }}-image-
            v3-${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ steps.vcpkg-cache.outputs.revision }}-x64-windows-cpu-dispatch-
            v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve model metadata
        id: model
        shell: pwsh
        run: |
          $metadataUrl = 'https://huggingface.co/api/models/tony65535/llavon-ime-llama-250m-GGUF/revision/main?blobs=true'
          $modelFilename = 'llavon-ime-llama-250m-Q4_K_M.gguf'
          $metadata = Invoke-RestMethod -Uri $metadataUrl
          $model = @($metadata.siblings | Where-Object rfilename -EQ $modelFilename)

          if ($metadata.sha -notmatch '^[0-9a-f]{40}$') {
            throw "Hugging Face returned an invalid model revision: $($metadata.sha)"
          }
          if ($model.Count -ne 1 -or $model[0].lfs.sha256 -notmatch '^[0-9a-f]{64}$' -or
              [long]$model[0].lfs.size -le 0) {
            throw "Hugging Face did not return valid LFS metadata for $modelFilename"
          }

          "revision=$($metadata.sha)" >> $env:GITHUB_OUTPUT
          "sha256=$($model[0].lfs.sha256)" >> $env:GITHUB_OUTPUT
          "size=$($model[0].lfs.size)" >> $env:GITHUB_OUTPUT

      - name: Create cache directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null

      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        shell: pwsh
        run: >-
          cmake --preset windows
          -DVCPKG_TARGET_TRIPLET=x64-windows-cpu-dispatch
          "-DLLAVON_IME_MODEL_REVISION=${{ steps.model.outputs.revision }}"
          "-DLLAVON_IME_MODEL_SHA256=${{ steps.model.outputs.sha256 }}"
          "-DLLAVON_IME_MODEL_SIZE=${{ steps.model.outputs.size }}"

      - name: Build web installer
        shell: pwsh
        run: cmake --build build/windows --config Release --target llavon-ime-setup --parallel

      - name: Verify packaged CPU backends
        shell: pwsh
        run: |
          $cpuDlls = @(Get-ChildItem build/windows/vcpkg_installed/x64-windows-cpu-dispatch/bin -Filter 'ggml-cpu*.dll')
          if ($cpuDlls.Count -lt 2) {
            throw "Expected multiple dynamic CPU backends, found $($cpuDlls.Count)"
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsRoot) {
            throw "Visual Studio C++ tools were not found"
          }

          $dumpbin = Get-ChildItem "$vsRoot\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object FullName -Like '*\bin\Hostx64\x64\dumpbin.exe' |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe was not found"
          }

          $withZmm = 0
          $withoutZmm = 0
          foreach ($cpuDll in $cpuDlls) {
            $exports = & $dumpbin.FullName /nologo /exports $cpuDll.FullName
            if ($null -eq ($exports | Select-String -SimpleMatch 'ggml_backend_init' | Select-Object -First 1)) {
              throw "$($cpuDll.Name) does not export ggml_backend_init"
            }
            if ($null -eq ($exports | Select-String -SimpleMatch 'ggml_backend_score' | Select-Object -First 1)) {
              throw "$($cpuDll.Name) does not export ggml_backend_score"
            }

            $hasZmm = $null -ne (
              & $dumpbin.FullName /nologo /disasm:nobytes $cpuDll.FullName |
              Select-String -Pattern '\bzmm[0-9]+\b' |
              Select-Object -First 1
            )
            if ($hasZmm) {
              $withZmm++
            } else {
              $withoutZmm++
            }
            Write-Host "Verified $($cpuDll.Name): has_zmm=$hasZmm"
          }

          if ($withZmm -eq 0 -or $withoutZmm -eq 0) {
            throw "Expected both baseline and AVX-512 CPU backends: with_zmm=$withZmm without_zmm=$withoutZmm"
          }
          Write-Host "Verified $($cpuDlls.Count) CPU backends: with_zmm=$withZmm without_zmm=$withoutZmm"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: llavon-ime-build-logs
          path: |
            build/windows/**/*.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Show MSI
        shell: pwsh
        run: Get-Item build/windows/llavon-ime-0.0.1-windows.msi | Select-Object FullName, Length, LastWriteTime

      - name: Show web installer
        shell: pwsh
        run: Get-ChildItem build/windows -Filter *.exe | Select-Object FullName, Length, LastWriteTime

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: llavon-ime-windows-msi
          path: build/windows/llavon-ime-0.0.1-windows.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload web installer
        uses: actions/upload-artifact@v4
        with:
          name: llavon-ime-windows-setup
          path: build/windows/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-latest:
    name: Publish latest release
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build-msi
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download MSI artifacts
        uses: actions/download-artifact@v4
        with:
          name: llavon-ime-windows-msi
          path: release-assets

      - name: Download web installer artifact
        uses: actions/download-artifact@v4
        with:
          name: llavon-ime-windows-setup
          path: release-assets

      - name: Publish latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msis = @(Get-ChildItem release-assets -Filter *.msi | Sort-Object Name)
          if ($msis.Count -ne 1) {
            throw "Expected one MSI, found $($msis.Count)"
          }
          $msi = $msis[0]
          $setups = @(Get-ChildItem release-assets -Filter *.exe | Sort-Object Name)
          if ($setups.Count -ne 1) {
            throw "Expected one web installer, found $($setups.Count)"
          }
          $setup = $setups[0]

          $manifestPath = Join-Path $PWD "latest.json"
          $releaseVersion = "${{ needs.build-msi.outputs.release-version }}"
          $releaseTag = "v$releaseVersion"
          $setupSha256 = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

          gh release view $releaseTag --json targetCommitish *> $null
          if ($LASTEXITCODE -eq 0) {
            $targetCommit = (& gh release view $releaseTag --json targetCommitish --jq .targetCommitish).Trim()
            if ($targetCommit -ne "${{ github.sha }}") {
              throw "$releaseTag already exists for another commit: $targetCommit"
            }
            gh release upload $releaseTag $setup.FullName $msi.FullName --clobber
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            gh release edit $releaseTag --notes-file .github/release-notes.md
          } else {
            gh release create $releaseTag $setup.FullName $msi.FullName `
              --target "${{ github.sha }}" `
              --title "Llavon IME $releaseVersion" `
              --notes-file .github/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $release = gh api "repos/${{ github.repository }}/releases/tags/$releaseTag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $matchingAssets = @($release.assets | Where-Object {
            $_.digest -eq "sha256:$setupSha256" -and $_.size -eq $setup.Length
          })
          if ($matchingAssets.Count -ne 1) {
            throw "Could not identify the uploaded setup asset by SHA-256 and size"
          }
          $setupUrl = $matchingAssets[0].browser_download_url
          $manifest = [ordered]@{
            schema = 1
            version = $releaseVersion
            build = [long]"${{ github.run_number }}"
            commit = "${{ github.sha }}"
            published_at = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(8)).ToString("o")
            setup = [ordered]@{
              url = $setupUrl
              size = [long]$setup.Length
              sha256 = $setupSha256
            }
          } | ConvertTo-Json -Depth 4 -Compress
          [System.IO.File]::WriteAllText(
            $manifestPath,
            $manifest,
            [System.Text.UTF8Encoding]::new($false)
          )
          gh release upload $releaseTag $manifestPath --clobber
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force latest "${{ github.sha }}"
          git push --force origin refs/tags/latest

          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest --yes
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          gh release create latest $setup.FullName $msi.FullName $manifestPath `
            --title "Latest Windows build" `
            --notes-file .github/release-notes.md `
            --latest
