name: Build MSI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  build-msi:
    name: Build Windows MSI
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-cache
            vcpkg/downloads
          key: ${{ runner.os }}-vcpkg-x64-windows-cpu-dispatch-${{ hashFiles('cmake/triplets/*.cmake', 'ime-windows-service/vcpkg.json', 'ime-windows-service/vcpkg-configuration.json', 'ime-windows-service/ime-core/vcpkg.json', 'ime-windows-service/ime-core/vcpkg-configuration.json', 'ime-windows-frontend/vcpkg.json', 'ime-windows-frontend/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-x64-windows-cpu-dispatch-

      - name: Cache model download
        uses: actions/cache@v4
        with:
          path: build/windows/downloads
          key: ${{ runner.os }}-model-${{ hashFiles('CMakeLists.txt', 'cmake/DownloadModel.cmake') }}
          restore-keys: |
            ${{ runner.os }}-model-

      - name: Create cache directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force .vcpkg-cache, build/windows/downloads | Out-Null

      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        shell: pwsh
        run: cmake --preset windows -DLLAVON_IME_VCPKG_TRIPLET=x64-windows-cpu-dispatch

      - name: Build MSI
        shell: pwsh
        run: cmake --build --preset package --parallel

      - name: Verify packaged CPU backends
        shell: pwsh
        run: |
          $cpuDlls = @(Get-ChildItem dist/ime-windows-service/bin -Filter 'ggml-cpu*.dll')
          if ($cpuDlls.Count -lt 2) {
            throw "Expected multiple dynamic CPU backends, found $($cpuDlls.Count)"
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsRoot) {
            throw "Visual Studio C++ tools were not found"
          }

          $dumpbin = Get-ChildItem "$vsRoot\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object FullName -Like '*\bin\Hostx64\x64\dumpbin.exe' |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe was not found"
          }

          $withZmm = 0
          $withoutZmm = 0
          foreach ($cpuDll in $cpuDlls) {
            $exports = & $dumpbin.FullName /nologo /exports $cpuDll.FullName
            if ($null -eq ($exports | Select-String -SimpleMatch 'ggml_backend_init' | Select-Object -First 1)) {
              throw "$($cpuDll.Name) does not export ggml_backend_init"
            }
            if ($null -eq ($exports | Select-String -SimpleMatch 'ggml_backend_score' | Select-Object -First 1)) {
              throw "$($cpuDll.Name) does not export ggml_backend_score"
            }

            $hasZmm = $null -ne (
              & $dumpbin.FullName /nologo /disasm:nobytes $cpuDll.FullName |
              Select-String -Pattern '\bzmm[0-9]+\b' |
              Select-Object -First 1
            )
            if ($hasZmm) {
              $withZmm++
            } else {
              $withoutZmm++
            }
            Write-Host "Verified $($cpuDll.Name): has_zmm=$hasZmm"
          }

          if ($withZmm -eq 0 -or $withoutZmm -eq 0) {
            throw "Expected both baseline and AVX-512 CPU backends: with_zmm=$withZmm without_zmm=$withoutZmm"
          }
          Write-Host "Verified $($cpuDlls.Count) CPU backends: with_zmm=$withZmm without_zmm=$withoutZmm"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: llavon-ime-build-logs
          path: |
            build/windows/**/*.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Show MSI
        shell: pwsh
        run: Get-Item build/windows/llavon-ime-*-windows.msi | Select-Object FullName, Length, LastWriteTime

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: llavon-ime-windows-msi
          path: build/windows/llavon-ime-*-windows.msi
          if-no-files-found: error
          retention-days: 14

  publish-latest:
    name: Publish latest release
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build-msi
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download MSI artifacts
        uses: actions/download-artifact@v4
        with:
          name: llavon-ime-windows-msi
          path: release-assets

      - name: Publish latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msis = @(Get-ChildItem release-assets -Filter *.msi | Sort-Object Name)
          if ($msis.Count -ne 1) {
            throw "Expected one MSI, found $($msis.Count)"
          }
          $msi = $msis[0]

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force latest "${{ github.sha }}"
          git push --force origin refs/tags/latest

          $manifestPath = Join-Path $PWD "latest.json"
          $manifest = [ordered]@{
            schema = 1
            build = [long]"${{ github.run_number }}"
            commit = "${{ github.sha }}"
            published_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText(
            $manifestPath,
            $manifest,
            [System.Text.UTF8Encoding]::new($false)
          )

          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest --yes
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          gh release create latest $msi.FullName $manifestPath `
            --title "Latest Windows build" `
            --notes "One CPU package automatically selects the fastest compatible ggml backend at runtime. Automatically updated from build #${{ github.run_number }} at commit ${{ github.sha }} on the default branch." `
            --latest
